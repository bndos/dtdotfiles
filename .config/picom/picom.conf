corner-radius = 15.0;
rounded-corners-exclude = [
  # "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'unknown'",
  # "class_g = 'Polybar'",
  "class_g = 'firefox'",
  "class_g = 'xmobar'",
  "class_g = 'Thunderbird'"
];

# Shadow
shadow = true;
# no-dnd-shadow = true;
# no-dock-shadow = true;
shadow-radius = 32;
shadow-offset-x = -30;
shadow-offset-y = -30;
shadow-opacity = 0.98;
shadow-exclude = [ "class_g = 'firefox' && argb", "class_g = 'Rofi'" ];

# Opacity
# menu-opacity = 1.0;
# inactive-opacity = 1.0;
blur-background = false;
blur-kern = "3x3box";
blur-background-fixed = false;
blur-background-exclude = [ "window_type = 'desktop'" ];


# Fading
fading = true;
fade-delta = 8;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [ ];

# Other
backend = "glx";
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = false;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0;
# vsync = true;
dbe = false;
sw-opti = false;
unredir-if-possible = false;
focus-exclude = [ ];
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];

# GLX backend
glx-no-stencil = true;
glx-copy-from-front = false;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;
use-damage = true;

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; };
};
