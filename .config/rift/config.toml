[settings]
animate = false
hot_reload = true
default_disable = false
focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = true

[settings.layout]
mode = "bsp"
window_insertion_point = "next_to_selection"

[settings.ui.menu_bar]
enabled = true
show_empty = false
mode = "active"
active_label = "index"
display_style = "label"
layout_folder = "~/.config/rift/layouts"

[virtual_workspaces]
enabled = true
default_workspace_count = 10
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = false
workspace_names = [
  "one",
  "two",
  "three",
  "four",
  "five",
  "six",
  "seven",
  "eight",
  "nine",
  "ten",
]
workspace_rules = [
  { workspace = 0, layout = "bsp" },
  { workspace = 1, layout = "bsp" },
  { workspace = 2, layout = "bsp" },
  { workspace = 3, layout = "bsp" },
  { workspace = 4, layout = "bsp" },
  { workspace = 5, layout = "bsp" },
  { workspace = 6, layout = "bsp" },
  { workspace = 7, layout = "bsp" },
  { workspace = 8, layout = "bsp" },
  { workspace = 9, layout = "bsp" },
]
app_rules = []

[keys]
"Meta + H" = "prev_window"
"Meta + J" = { move_focus = "down" }
"Meta + K" = { move_focus = "up" }
"Meta + L" = "next_window"

"Meta + Shift + H" = { move_node = "left" }
"Meta + Shift + J" = { move_node = "down" }
"Meta + Shift + K" = { move_node = "up" }
"Meta + Shift + L" = { move_node = "right" }

"Meta + 1" = { switch_to_workspace = 0 }
"Meta + 2" = { switch_to_workspace = 1 }
"Meta + 3" = { switch_to_workspace = 2 }
"Meta + 4" = { switch_to_workspace = 3 }
"Meta + 5" = { switch_to_workspace = 4 }
"Meta + 6" = { switch_to_workspace = 5 }
"Meta + 7" = { switch_to_workspace = 6 }
"Meta + 8" = { switch_to_workspace = 7 }
"Meta + 9" = { switch_to_workspace = 8 }
"Meta + 0" = { switch_to_workspace = 9 }

"Meta + Shift + 1" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Meta + Shift + 2" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Meta + Shift + 3" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Meta + Shift + 4" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Meta + Shift + 5" = { move_window_to_workspace = { workspace = 4, follow = true } }
"Meta + Shift + 6" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Meta + Shift + 7" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Meta + Shift + 8" = { move_window_to_workspace = { workspace = 7, follow = true } }
"Meta + Shift + 9" = { move_window_to_workspace = { workspace = 8, follow = true } }
"Meta + Shift + 0" = { move_window_to_workspace = { workspace = 9, follow = true } }

"Meta + Comma" = { focus_display = "left" }
"Meta + Period" = { focus_display = "right" }
"Meta + Shift + Comma" = { move_window_to_display = { selector = "left" } }
"Meta + Shift + Period" = { move_window_to_display = { selector = "right" } }

"Meta + Tab" = "switch_to_last_workspace"
"Meta + Return" = { exec = ["/bin/bash", "-c", "open -a \"/System/Applications/Utilities/Terminal.app\""] }
"Meta + Shift + Space" = "toggle_window_floating"
"Meta + M" = { set_workspace_layout = { mode = "stack" } }
"Meta + B" = { set_workspace_layout = { mode = "bsp" } }
"Meta + F" = "toggle_fullscreen"
"Meta + Shift + F" = "toggle_fullscreen_within_gaps"
"Meta + Z" = "toggle_space_activated"
"Alt + Z" = "toggle_space_activated"
