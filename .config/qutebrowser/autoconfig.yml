# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/master/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  aliases:
    global:
      folio: open https://cas.polymtl.ca/cas/login?service=https%3A%2F%2Fpolyfolio.polymtl.ca%2Flogin
      imp: open https://www.imp.polymtl.ca/login.php
      moodle: open https://moodle.polymtl.ca/login/index.php
      q: close
      qa: quit
      w: session-save
      wq: quit --save
      wqa: quit --save
  backend:
    global: webengine
  bindings.commands:
    global:
      normal: null
  bindings.key_mappings:
    global:
      <Ctrl+6>: <Ctrl+^>
      <Ctrl+Enter>: <Ctrl+Return>
      <Ctrl+[>: <Escape>
      <Ctrl+j>: <Return>
      <Ctrl+m>: <Return>
      <Enter>: <Return>
      <Shift+Enter>: <Return>
      <Shift+Return>: <Return>
  colors.completion.category.bg:
    global: 'qlineargradient(x1:0, y1:0, x2:0, y2:1, stop:0 #222222, stop:1 #222222)'
  colors.completion.category.fg:
    global: white
  colors.completion.even.bg:
    global: '#000000'
  colors.completion.item.selected.bg:
    global: '#e8c000'
  colors.completion.item.selected.border.bottom:
    global: '#bbbb00'
  colors.completion.item.selected.border.top:
    global: '#bbbb00'
  colors.completion.match.fg:
    global: '#ff4444'
  colors.completion.odd.bg:
    global: '#000000'
  colors.hints.match.fg:
    global: green
  colors.keyhint.bg:
    global: rgba(0, 0, 0, 80%)
  colors.prompts.bg:
    global: '#000000'
  colors.prompts.border:
    global: 1px solid black
  colors.prompts.fg:
    global: white
  colors.prompts.selected.bg:
    global: black
  colors.statusbar.caret.bg:
    global: purple
  colors.statusbar.caret.fg:
    global: black
  colors.statusbar.caret.selection.bg:
    global: '#000000'
  colors.statusbar.caret.selection.fg:
    global: black
  colors.statusbar.command.fg:
    global: white
  colors.statusbar.command.private.bg:
    global: black
  colors.statusbar.insert.bg:
    global: black
  colors.statusbar.insert.fg:
    global: white
  colors.statusbar.normal.bg:
    global: black
  colors.statusbar.normal.fg:
    global: black
  colors.statusbar.passthrough.bg:
    global: darkblue
  colors.statusbar.passthrough.fg:
    global: black
  colors.statusbar.private.bg:
    global: '#666666'
  colors.statusbar.private.fg:
    global: black
  colors.statusbar.progress.bg:
    global: black
  colors.statusbar.url.error.fg:
    global: orange
  colors.statusbar.url.fg:
    global: black
  colors.statusbar.url.hover.fg:
    global: black
  colors.statusbar.url.success.http.fg:
    global: black
  colors.statusbar.url.success.https.fg:
    global: black
  colors.tabs.bar.bg:
    global: black
  colors.tabs.even.bg:
    global: black
  colors.tabs.even.fg:
    global: grey
  colors.tabs.odd.bg:
    global: black
  colors.tabs.odd.fg:
    global: grey
  colors.tabs.selected.even.fg:
    global: black
  colors.tabs.selected.odd.bg:
    global: black
  colors.tabs.selected.odd.fg:
    global: black
  editor.command:
    global:
    - gvim
    - -f
    - '{file}'
    - -c
    - normal {line}G{column0}l
  fonts.completion.category:
    global: 10pt Monego
  fonts.completion.entry:
    global: 10pt Monego
  fonts.debug_console:
    global: 10pt Monego
  fonts.default_family:
    global:
    - Ubuntu
  fonts.downloads:
    global: 10pt Monego
  fonts.hints:
    global: bold 10pt Monego
  fonts.keyhint:
    global: 10pt Monego
  fonts.messages.error:
    global: 10pt Monego
  fonts.messages.info:
    global: 10pt Monego
  fonts.messages.warning:
    global: 10pt Monego
  fonts.prompts:
    global: 10pt Monego
  fonts.statusbar:
    global: 10pt Monego
  fonts.tabs:
    global: 12pt Monaco
  fonts.web.family.cursive:
    global: Ubuntu
  fonts.web.family.fantasy:
    global: Ubuntu
  fonts.web.family.fixed:
    global: Ubuntu
  fonts.web.family.sans_serif:
    global: Ubuntu
  fonts.web.family.serif:
    global: Ubuntu
  fonts.web.family.standard:
    global: Ubuntu
  scrolling.bar:
    global: never
  statusbar.hide:
    global: true
  tabs.width:
    global: 300
  url.default_page:
    global: https://start.duckduckgo.com/
  url.incdec_segments:
    global:
    - path
    - query
  url.open_base_url:
    global: false
  url.searchengines:
    global:
      DEFAULT: https://duckduckgo.com/?q={}
      aw: https://wiki.archlinux.org/?search={}
      gg: https://google.com/search?query={}
      git: https://github.com/search?q={}
      yt: https://youtube.com/results?search_query={}
  url.start_pages:
    global: file:///home/bndo/startup-page.html
